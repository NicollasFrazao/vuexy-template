services:
  # Aplicação Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vuexy-laravel-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - vuexy-network
    depends_on:
      - mysql
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: vuexy-laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - vuexy-network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:9.1
    container_name: vuexy-laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vuexy_laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-vuexy}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - vuexy-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: vuexy-laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - vuexy-network

  # Node.js para compilar assets (Vite)
  node:
    image: node:22-alpine
    container_name: vuexy-laravel-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - vuexy-network

networks:
  vuexy-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
